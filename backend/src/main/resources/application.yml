server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: prajamitra-backend

  datasource:
    # Prefer DB_HOST (Docker Compose); fall back to SQL_HOST for local .env.example
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:${SQL_HOST:localhost}}:${DB_PORT:${SQL_PORT:5432}}/${DB_NAME:prajamitra}}
    username: ${DATABASE_USERNAME:${DB_USER}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

# PrajaMitra Configuration (CORS & JWT) — secrets from environment only
prajamitra:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: "*"
    allow-credentials: true
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    root: INFO
    com.prajamitra: DEBUG
    org.springframework.security: INFO
